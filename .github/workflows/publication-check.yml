name: Publication checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public files and documentation
        run: |
          python3 tools/check-public
          python3 tools/check-docs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p publication_test.py
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan files and reachable history for secrets
        run: |
          scan_dir=$(mktemp -d "$RUNNER_TEMP/publication.XXXXXX")
          git checkout-index --all --prefix="$scan_dir/"
          "$RUNNER_TEMP/gitleaks" dir "$scan_dir" --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact --no-banner
